<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Hermes UI</title>
    <style>
      :root {
        --bg: #09090b;
        --card: #18181b;
        --border: #27272a;
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 24px;
        user-select: none;
      }
      .container {
        width: 100%;
        max-width: 400px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .logo-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .logo-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 20px;
        color: #fff;
      }
      h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
      p.subtitle { color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 4px; }
      .field { margin-top: 20px; }
      label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
      input[type="url"], input[type="text"] {
        width: 100%;
        background: #09090b;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        color: #fff;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease;
      }
      input:focus { border-color: var(--primary); }
      .btn-primary {
        width: 100%;
        margin-top: 20px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .btn-primary:active { background: var(--primary-hover); }
      .btn-secondary {
        width: 100%;
        margin-top: 10px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      .status-box {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 12px;
        display: none;
        line-height: 1.4;
      }
      .status-box.error {
        display: block;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }
      .status-box.info {
        display: block;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        color: #93c5fd;
      }
      .help-text {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        background: #09090b;
        padding: 2px 6px;
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
        color: #e4e4e7;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-row">
        <div class="logo-icon">H</div>
        <div>
          <h1>Hermes UI</h1>
          <p class="subtitle">Mobile Gateway Client</p>
        </div>
      </div>

      <form id="connect-form">
        <div class="field">
          <label for="gateway-url">Gateway Server URL</label>
          <input
            id="gateway-url"
            type="url"
            required
            placeholder="http://192.168.1.100:9119"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Connect to Hermes</button>
        <button type="button" id="clear-btn" class="btn-secondary" style="display: none;">Clear Saved Server</button>
      </form>

      <div id="status-msg" class="status-box"></div>

      <div class="help-text">
        Ensure Hermes is running on your host machine:<br />
        <code>hermes dashboard --host 0.0.0.0 --port 9119</code>
      </div>
    </div>

    <script>
      const form = document.getElementById('connect-form');
      const input = document.getElementById('gateway-url');
      const submitBtn = document.getElementById('submit-btn');
      const clearBtn = document.getElementById('clear-btn');
      const statusBox = document.getElementById('status-msg');

      function showStatus(text, type = 'info') {
        statusBox.className = 'status-box ' + type;
        statusBox.innerHTML = text;
      }

      function hideStatus() {
        statusBox.className = 'status-box';
        statusBox.style.display = 'none';
      }

      const savedUrl = localStorage.getItem('hermes_gateway_url');
      const urlParams = new URLSearchParams(window.location.search);
      const isSettings = urlParams.get('settings') === '1';

      if (savedUrl) {
        input.value = savedUrl;
        clearBtn.style.display = 'block';

        if (!isSettings) {
          showStatus('<span class="spinner"></span> Connecting to saved gateway...', 'info');
          // Navigate to saved gateway
          setTimeout(() => {
            window.location.href = savedUrl;
          }, 300);
        }
      }

      clearBtn.addEventListener('click', () => {
        localStorage.removeItem('hermes_gateway_url');
        input.value = '';
        clearBtn.style.display = 'none';
        hideStatus();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let target = input.value.trim().replace(/\/+$/, '');
        if (!target.startsWith('http://') && !target.startsWith('https://')) {
          target = 'http://' + target;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> Verifying...';
        showStatus('Verifying server reachability...', 'info');

        // Test reachability via mode: 'no-cors' probe
        const probeController = new AbortController();
        const timeoutId = setTimeout(() => probeController.abort(), 4000);

        fetch(target + '/api/status', {
          mode: 'no-cors',
          signal: probeController.signal
        })
          .then(() => {
            clearTimeout(timeoutId);
            localStorage.setItem('hermes_gateway_url', target);
            showStatus('Connected! Loading Hermes UI...', 'info');
            setTimeout(() => {
              window.location.href = target;
            }, 200);
          })
          .catch((err) => {
            clearTimeout(timeoutId);
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Connect to Hermes';
            showStatus('Failed to reach gateway at <code>' + target + '</code>.<br/>Please check Wi-Fi and make sure Hermes is running with <code>--host 0.0.0.0</code>.', 'error');
          });
      });
    </script>
  </body>
</html>
